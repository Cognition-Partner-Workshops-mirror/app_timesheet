# CareAI Platform - Nginx Reverse Proxy Configuration
# Routes traffic to backend API, admin panel, and serves static Flutter web build
# Deployed on AWS EC2 as the main entry point for all services

events {
    worker_connections 1024;
}

http {
    # Upstream service definitions
    upstream backend {
        server backend:8000;
    }

    upstream admin {
        server admin:80;
    }

    # Rate limiting zone to prevent API abuse
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Main server block - handles all incoming traffic
    server {
        listen 80;
        server_name _;

        # Max upload size for health record file uploads (S3-bound)
        client_max_body_size 20M;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # Backend API proxy - all /api/* requests
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for real-time consultation features
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # FastAPI auto-generated docs
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Backend health check endpoint
        location /health {
            proxy_pass http://backend;
        }

        # Admin panel - web dashboard
        location /admin/ {
            proxy_pass http://admin/;
            proxy_set_header Host $host;
        }

        # Static file uploads served from local storage (fallback when S3 not configured)
        location /uploads/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Flutter web build - patient/doctor mobile web app
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Gzip compression for better performance
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
        gzip_min_length 256;
    }
}
