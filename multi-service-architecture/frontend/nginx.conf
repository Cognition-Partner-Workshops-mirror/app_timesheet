# Nginx configuration for serving the React SPA.
# Routes API and GraphQL requests to the API Gateway,
# and serves static assets for all other paths.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy REST API requests to the Node.js API Gateway
    location /api/ {
        proxy_pass http://api-gateway:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy GraphQL requests to the Node.js API Gateway
    location /graphql {
        proxy_pass http://api-gateway:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve static files and fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
