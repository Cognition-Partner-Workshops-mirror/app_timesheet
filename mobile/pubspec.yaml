name: careai_mobile
description: "CareAI - AI-Powered Healthcare Platform Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client for API calls
  http: ^1.2.0

  # State management
  provider: ^6.1.0

  # Local storage for tokens and preferences
  shared_preferences: ^2.3.0

  # SVG support for icons
  flutter_svg: ^2.0.0

  # Date formatting
  intl: ^0.19.0

  # Smooth page indicators for onboarding
  smooth_page_indicator: ^1.2.0

  # Google Fonts for beautiful typography
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
