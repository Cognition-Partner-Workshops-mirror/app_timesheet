# AI Model Service Deployment
# Runs on GPU-enabled nodes with NVIDIA device plugin
# Requires: nvidia/k8s-device-plugin DaemonSet installed on GPU nodes

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: virtual-tryon
  labels:
    app: ai-service
    app.kubernetes.io/part-of: virtual-tryon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      # Schedule only on GPU-labeled nodes
      nodeSelector:
        gpu-type: nvidia
      # Tolerate GPU node taints
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: ai-service
          image: virtual-tryon/ai-service:latest
          ports:
            - containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tryon-config
            - secretRef:
                name: tryon-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
              nvidia.com/gpu: "1"  # Request 1 GPU
            limits:
              cpu: "2000m"
              memory: "4Gi"
              nvidia.com/gpu: "1"  # Limit to 1 GPU
          # Model loading takes ~60s, use longer start period
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          # Persistent volume for model cache
          volumeMounts:
            - name: model-cache
              mountPath: /app/models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
      restartPolicy: Always

---
# AI Service - ClusterIP for backend-to-AI communication
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: virtual-tryon
  labels:
    app: ai-service
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP

---
# PersistentVolumeClaim for model cache
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache-pvc
  namespace: virtual-tryon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# Horizontal Pod Autoscaler for AI service
# Scales based on GPU utilization and request queue depth
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-service-hpa
  namespace: virtual-tryon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60  # Wait for model loading
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600  # Avoid cold starts
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
