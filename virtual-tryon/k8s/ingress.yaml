# Nginx Ingress Controller configuration
# Provides external access with TLS termination and path-based routing

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tryon-ingress
  namespace: virtual-tryon
  labels:
    app.kubernetes.io/part-of: virtual-tryon
  annotations:
    # Nginx ingress controller annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"  # Max upload size
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    # CORS headers
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.example.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
      secretName: tryon-tls-secret
  rules:
    - host: api.example.com
      http:
        paths:
          # Route API requests to the backend service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # Route health checks to the backend service
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # Route static assets / images to MinIO
          - path: /storage
            pathType: Prefix
            backend:
              service:
                name: minio-service
                port:
                  number: 9000
