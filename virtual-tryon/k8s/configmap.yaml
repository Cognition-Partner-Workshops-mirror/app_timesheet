# ConfigMap for non-sensitive application configuration
# These values are injected as environment variables into pods

apiVersion: v1
kind: ConfigMap
metadata:
  name: tryon-config
  namespace: virtual-tryon
  labels:
    app.kubernetes.io/part-of: virtual-tryon
data:
  # Backend service configuration
  APP_NAME: "Virtual Try-On API"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  API_V1_PREFIX: "/api/v1"

  # Database connection
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres-service:5432/virtual_tryon"

  # Redis connection
  REDIS_URL: "redis://redis-service:6379/0"
  REDIS_CACHE_TTL: "3600"

  # Object storage connection
  STORAGE_ENDPOINT: "minio-service:9000"
  STORAGE_BUCKET_NAME: "virtual-tryon"
  STORAGE_USE_SSL: "false"

  # AI service connection
  AI_SERVICE_URL: "http://ai-service:8001"
  AI_SERVICE_TIMEOUT: "60"

  # CORS origins
  CORS_ORIGINS: '["https://app.example.com"]'

  # AI service specific
  USE_GPU: "true"
  MIXED_PRECISION: "true"
  GPU_DEVICE_ID: "0"
  INPUT_WIDTH: "768"
  INPUT_HEIGHT: "1024"
