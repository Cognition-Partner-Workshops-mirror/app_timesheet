# Docker Compose configuration for the Product Microservices stack.
# Orchestrates PostgreSQL, Product Service, and API Gateway containers.
version: '3.8'

services:
  # PostgreSQL database for the Product Service
  postgres:
    image: postgres:16-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - product-network

  # Product Service - core microservice for product catalog CRUD
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: product_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - product-network
    restart: unless-stopped

  # API Gateway - central entry point routing requests to microservices
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      PORT: 3000
      NODE_ENV: production
      PRODUCT_SERVICE_URL: http://product-service:3001
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      - product-service
    networks:
      - product-network
    restart: unless-stopped

# Persistent volume for PostgreSQL data
volumes:
  postgres_data:
    driver: local

# Isolated network for inter-service communication
networks:
  product-network:
    driver: bridge
