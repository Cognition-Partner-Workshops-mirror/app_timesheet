# CI/CD pipeline for the Product Microservices project.
# Runs linting, tests, and Docker build verification on every push and PR.
name: Product Microservices CI

on:
  push:
    branches: [main]
    paths:
      - 'microservices-product/**'
  pull_request:
    branches: [main]
    paths:
      - 'microservices-product/**'

jobs:
  # Lint and test the Product Service
  product-service-test:
    name: Product Service - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices-product/product-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: microservices-product/product-service/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests with coverage
        run: npm test

  # Lint the API Gateway
  api-gateway-lint:
    name: API Gateway - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices-product/api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: microservices-product/api-gateway/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint --if-present

  # Verify Docker images build correctly
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [product-service-test, api-gateway-lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Product Service image
        run: docker build -t product-service:test ./microservices-product/product-service

      - name: Build API Gateway image
        run: docker build -t api-gateway:test ./microservices-product/api-gateway
